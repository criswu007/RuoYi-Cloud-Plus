# Tomcat
server:
  port: 8080
  servlet:
    context-path: /

# Spring
spring:
  application:
    # 应用名称
    name: ruoyi-gateway
  profiles:
    # 环境配置
    active: @profiles.active@

--- # nacos 配置
spring:
  cloud:
    nacos:
      # nacos 服务地址
      server-addr: @nacos.server@
      username: @nacos.username@
      password: @nacos.password@
      discovery:
        # 注册组
        group: @nacos.discovery.group@
        namespace: ${spring.profiles.active}
      config:
        # 配置组
        group: @nacos.config.group@
        namespace: ${spring.profiles.active}
    gateway:
      routes:
        # MQ演示服务
        - id: ruoyi-test-mq
          uri: lb://ruoyi-test-mq
          predicates:
            - Path=/test-mq/**
          filters:
            - StripPrefix=1
        # 地址服务
        - id: ruoyi-address
          uri: lb://ruoyi-address
          predicates:
            - Path=/address/**
          filters:
            - StripPrefix=1
  config:
    import:
      - optional:nacos:application-common.yml
      - optional:nacos:${spring.application.name}.yml
