server:
  port: 9206

spring:
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.apache.seata.spring.boot.autoconfigure.SeataCoreAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataDataSourceAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataHttpAutoConfiguration
      - org.apache.seata.spring.boot.autoconfigure.SeataSagaAutoConfiguration
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - com.baomidou.lock.spring.boot.autoconfigure.LockAutoConfiguration
      - com.baomidou.lock.spring.boot.autoconfigure.RedissonLockAutoConfiguration
      - org.dromara.common.translation.config.TranslationConfig
      - org.dromara.common.translation.core.impl.DeptNameTranslationImpl
      - org.dromara.common.translation.core.impl.DictTypeTranslationImpl
      - org.dromara.common.translation.core.impl.OssUrlTranslationImpl
      - org.dromara.common.translation.core.impl.UserNameTranslationImpl
      - org.dromara.common.translation.core.impl.NicknameTranslationImpl
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    dynamic:
      primary: address
      strict: true
      p6spy: false
      seata: false
      datasource:
        address:
          driver-class-name: com.mysql.cj.jdbc.Driver
          url: ${ADDRESS_DATASOURCE_URL:${ADDRESS_DB_URL:jdbc:mysql://127.0.0.1:3306/ftth_cloud_address?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&rewriteBatchedStatements=true&allowPublicKeyRetrieval=true}}
          username: ${ADDRESS_DATASOURCE_USERNAME:${ADDRESS_DB_USERNAME:root}}
          password: ${ADDRESS_DATASOURCE_PASSWORD:${ADDRESS_DB_PASSWORD:ruoyi123}}
  cloud:
    discovery:
      enabled: false
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
    service-registry:
      auto-registration:
        enabled: false
  data:
    redis:
      repositories:
        enabled: false
sa-token:
  check-same-token: false
  jwt-secret-key: standalone-address-local-jwt-secret

mybatis-plus:
  enableLogicDelete: true
  mapperPackage: org.dromara.**.mapper
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  typeAliasesPackage: org.dromara.**.domain
  configuration:
    logImpl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    dbConfig:
      idType: ASSIGN_ID

tenant:
  enable: false

dubbo:
  enabled: false
  application:
    qos-enable: false
    register-mode: instance
  protocol:
    name: dubbo
    port: -1
  registry:
    address: N/A
  metadata-report:
    address: N/A

management:
  health:
    redis:
      enabled: false

logging:
  level:
    org.springframework: warn
    org.apache.dubbo: error
    org.mybatis.spring.mapper: error
    org.dromara.address.mapper: debug

easy-es:
  enable: true

address:
  search:
    enabled: true
    refresh-policy: wait_for
    rebuild-batch-size: 500
    pit-keep-alive: 1m
    standard:
      alias: address_standard_search
      read-enabled: false
      write-enabled: false
    installation:
      alias: address_installation_search
      read-enabled: false
      write-enabled: false
